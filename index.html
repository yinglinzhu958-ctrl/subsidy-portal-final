<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Competition/Award Subsidy Portal prototype, School of Design, PolyU"><title>PolyU Design Subsidy Portal – Prototype</title>
<style>
:root{--r:#b8402c;--m:#8b1e2f;--bg:#fff6ee;--o:#fbc16f;--g:#aec968;--b:#ecd9c6;--t:#e0f3f0;--tx:#2b1d1a;--ln:#f0dcc8}
*{box-sizing:border-box}body{margin:0;background:#fff6ee;font:15px/1.5 system-ui,Arial,sans-serif;color:var(--tx)}
.vp{min-height:100vh;background:var(--bg);font-family:'Segoe UI',Arial,sans-serif;scroll-behavior:auto}
.vp h1,.vp h2,.vp h3,.logo{font-family:Georgia,'Playfair Display',serif;color:var(--r);margin:0}
.hd{background:linear-gradient(#8b1e2f,#8a2a1f);color:#fff;padding:14px 24px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.logo{color:#fff!important;font-size:20px;font-weight:700}.hd small{display:block;font:12px system-ui}
.nav{display:flex;gap:6px}.nav a{color:#fff;padding:8px 14px;border-radius:8px;text-decoration:none;cursor:pointer;font-weight:500}
.nav a.on{background:var(--o);color:#000;font-weight:700}
.top{display:flex;justify-content:space-between;gap:16px;padding:20px 24px;border-bottom:1px solid var(--ln);align-items:flex-start}
.top h1{font-size:30px}.who{text-align:right;font-size:13px}.who b{font-size:15px;display:block}
main{padding:20px 24px;max-width:1120px;margin:0 auto}
.card{background:#fff;border:1px solid var(--ln);border-radius:14px;padding:22px;margin-bottom:16px}
.card h2{font-size:21px;margin-bottom:12px}h2.s{font-size:22px;margin:22px 0 12px}
.btn,.btn2{font:700 15px system-ui;padding:12px 22px;border-radius:10px;cursor:pointer;border:2px solid var(--r);background:var(--r);color:#fff}
.btn2{background:#fff;color:var(--tx);border-color:var(--tx)}
.row{display:flex;gap:12px;justify-content:space-between;flex-wrap:wrap;margin-top:20px;padding-top:16px;border-top:1px solid var(--ln)}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:16px}
.stat{background:#fff;border:1px solid var(--ln);border-top:6px solid var(--g);border-radius:12px;padding:20px}
.stat b{display:block;font:700 30px Georgia,serif;margin:6px 0}.stat small{color:#6b5a52}
.bar{height:10px;border-radius:6px;background:var(--b);margin-top:10px}.bar i{display:block;height:100%;width:60%;background:var(--g);border-radius:6px}
.bd{display:inline-block;padding:2px 12px;border-radius:99px;font:700 12px system-ui;background:var(--o)}
.bd.g{background:var(--g)}.bd.rd{background:#f58a66}.bd.tl{background:#7ad0c4}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px}.steps div{background:var(--b);padding:10px 12px;border-radius:10px;font-size:13px}
.steps .d{background:var(--g)}.steps .c{background:var(--o);border:2px solid #000;font-weight:700}
.track{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}.track div{padding:10px 14px;border-radius:10px;background:var(--b);font-size:14px}
.track .d{background:var(--g)}.track .c{background:var(--o);border:2px solid #000;font-weight:700}.track .lk{background:none;border:2px dashed #6b5a52}
.note{background:var(--t);border-left:5px solid #7ad0c4;padding:12px 16px;margin:14px 0;border-radius:4px}.note.w{background:#fdeed7;border-color:#f58a66}
table{width:100%;border-collapse:collapse}th{background:#fdeed7;text-align:left;padding:10px}td{padding:12px 10px;border-top:1px solid var(--ln);vertical-align:top}
.f{margin-bottom:16px}.f label,.f legend{display:block;font-weight:700;font-size:14px;margin-bottom:4px;padding:0}
.f small{color:#6b5a52;display:block;margin-bottom:4px}
.f input[type=text],.f input[type=number],.f select,.f textarea{width:100%;padding:12px;border:2px solid var(--ln);border-radius:8px;font:15px inherit;background:#fff}
.f fieldset{border:0;padding:0;margin:0}.f .o{display:inline-flex;gap:8px;margin-right:22px;align-items:center}
.f .o input{accent-color:var(--r);width:18px;height:18px}
.err{color:#c0182b;font-weight:600;font-size:13px;margin-top:4px;display:none}.bad .err{display:block}.bad input[type=text],.bad input[type=number]{border-color:#c0182b}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.rv{display:grid;grid-template-columns:200px 1fr;gap:6px 16px}.rv span{color:#6b5a52;font-weight:600;font-size:13px}.rv b{font-weight:600}
.edit{float:right;font:700 13px system-ui;padding:6px 12px;border:2px solid var(--tx);border-radius:8px;background:#fff;cursor:pointer}
.lock{border:2px dashed #6b5a52;border-radius:12px;padding:18px;margin:10px 0;background:none}
.acc{border:1px solid var(--ln);border-radius:12px;background:#fff;margin-bottom:8px}
.acc button{width:100%;text-align:left;font:700 15px system-ui;background:none;border:0;padding:14px 18px;cursor:pointer;display:flex;justify-content:space-between}
.acc div{padding:0 18px 16px;display:none}.acc.o div{display:block}
.ol{list-style:none;padding:0;margin:0}.ol li{display:flex;gap:14px;margin-bottom:14px}.ol i{flex:none;width:30px;height:30px;border-radius:50%;background:var(--o);border:2px solid #000;display:grid;place-items:center;font:700 13px system-ui;font-style:normal}
.ft{padding:16px 24px;border-top:1px solid var(--ln);font-size:13px;color:#4b3f3a}
.bn{display:none}
a.lk{color:var(--r);font-weight:600;cursor:pointer}
@media (max-width:1100px){.g3{grid-template-columns:1fr 1fr}}
@media (max-width:760px){.g3,.g2{grid-template-columns:1fr}.steps{grid-template-columns:1fr 1fr}.track{grid-template-columns:1fr}
.top{flex-direction:column}.who{text-align:left}.rv{grid-template-columns:1fr}.hd .nav{display:none}.top h1{font-size:26px}
.bn{display:flex;position:sticky;bottom:0;background:var(--m);color:#fff;justify-content:space-around;padding:12px 0;z-index:5}.bn a{color:#fff;padding:4px 14px;border-radius:8px}.bn a.on{background:var(--o);color:#000;font-weight:700}
main,.top{padding-left:16px;padding-right:16px}.btn,.btn2{width:100%}.row{flex-direction:column-reverse}td,th{font-size:13px;padding:8px 6px}}
</style></head><body>
<div class="vp" id="vp"></div>
<script>
let scr='login';
const S={phone:'9123 4567',comp:'iF Student Design Award',url:'https://ifworlddesignguide.com/',lvl:'International',date:'2026-12-15',proj:'Wayfinding for first-time hospital visitors',grp:'Yes',mem:'Chan Tai Man, Lee Mei',cw:'Yes',subj:'SD3781 Interface Design',tutor:'Dr Lam',fee:'85',cur:'USD',ship:'600',endorser:'Specialism Leader',claim:'submitted',q:'',open:'who'};
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const NAMES={login:'0 Sign in (SSO)',dash:'1 Student dashboard',a1:'2 Apply step 1 – Your details',a2:'3 Apply step 2 – Competition',a3:'4 Apply step 3 – Claim',a4:'5 Apply step 4 – Review & send',ok:'6 Application sent',c1:'7 Claims – Submitted',c2:'8 Claims – Changes requested',c3:'9 Claims – Approved',c4:'10 Claims – Reimbursed',ref:'11 Reference list',ref0:'12 Reference list – no results',rules:'13 Rules & help',rules2:'14 Rules – Who can apply'};
const CL={c1:'submitted',c2:'changes',c3:'approved',c4:'reimbursed'};
const COMPS=[['A&D Trophy Awards','perspectiveglobal.com'],['AFI Awards','afi.com'],['AIGA Awards','aiga.org'],['Architecture MasterPrize','architectureprize.com'],['Aspen Shortsfest','aspenfilm.org'],['Berlin International Film Festival','berlinale.de'],['Cannes Film Festival','festival-cannes.com'],['Cannes Young Lion','canneslions.com'],['Chicago International Film Festival','chicagofilmfestival.com'],['CLIO Awards - Student Category','clioawards.com'],['D&AD New Blood Awards','dandad.org'],['DFA Design for Asia Awards','dfaawards.com'],['Digicon Asia','tbs.co.jp/digicon'],['Good Design Award','g-mark.org'],['HKICT Awards','hkictawards.hk'],['Hong Kong 4As Awards','aaaa.com.hk'],['iF Student Design Award','ifworlddesignguide.com'],['James Dyson Award','jamesdysonaward.org'],['Kokuyo Design Award','kokuyo.com'],['Pusan International Film Festival','biff.kr'],['Red Dot','red-dot.org'],['RSA Student Design Awards','sda.thersa.org'],['Spike Asia','spikes.asia'],['Sundance Film Festival','sundance.org'],['Young Guns','youngguns.org']];
const hdr=a=>`<header class="hd"><div class="logo">PolyU Design<small>Competition/Award Subsidy Portal 2026/27</small></div><nav class="nav" aria-label="Main"><a data-go="dash" class="${a=='d'?'on':''}">Dashboard</a><a data-go="a1" class="${a=='a'?'on':''}">Apply</a><a data-go="c1" class="${a=='c'?'on':''}">Claims</a></nav></header>`;
const bn=a=>`<nav class="bn" aria-label="Bottom"><a data-go="dash" class="${a=='d'?'on':''}">Dashboard</a><a data-go="a1" class="${a=='a'?'on':''}">Apply</a><a data-go="c1" class="${a=='c'?'on':''}">Claims</a></nav>`;
const who=`<div class="who"><b>Wong Yee Fong (23012345D)</b>BA (Hons) in Design (Interaction Design) • Year 3</div>`;
const foot=`<footer class="ft">School of Design · sdmktg@polyu.edu.hk · 2766 4925</footer>`;
const contact=`<section class="card"><h2>Contact SD Marketing</h2><b>School of Design, Marketing team</b><br>Email: <a class="lk">sdmktg@polyu.edu.hk</a><br>Telephone: <a class="lk">2766 4925</a><p><small>Ask here if you are not sure whether your competition or programme is eligible.</small></p></section>`;
const page=(a,t,sub,body,w=1)=>hdr(a)+`<div class="top"><div><h1>${t}</h1><div>${sub}</div></div>${who}</div><main>${body}</main>${foot}${bn(a)}`;
const stp=n=>`<div class="steps">${['Your details and eligibility','Competition and project','What you are claiming','Review and send'].map((x,i)=>`<div class="${i+1<n?'d':i+1==n?'c':''}">${i+1<n?'✓ ':''}${i+1}. ${x}</div>`).join('')}</div>`;
const fld=(id,l,v,t='text',h='')=>`<div class="f" data-f="${id}"><label for="${id}">${l} <small style="display:inline">(required)</small></label>${h?`<small>${h}</small>`:''}<input type="${t}" id="${id}" value="${v}"><div class="err" role="alert">Please fill in this field.</div></div>`;
const rad=(n,v,opts)=>opts.map(o=>`<label class="o"><input type="radio" name="${n}" value="${o}" ${v==o?'checked':''}> ${o}</label>`).join('');
const before=`<aside class="card"><h2>Before you send</h2><span class="bd">4 of 10 left</span><p><b>What is covered</b><br>The full entrance fee for each entry.<br>Shipping allowance up to HK$1,000.</p><p><b>What is not covered</b><br>Printing, production and publishing.<br>Credit card charges and bank fees.</p>Need help? <a class="lk" data-go="rules">Scheme rules and help</a></aside>`;
const V={
login:()=>`<header class="hd"><div class="logo">PolyU Design<small>Competition/Award Subsidy Portal 2026/27</small></div></header><main><div class="g2" style="align-items:start;margin-top:24px"><section><span class="bd">AY 2026/27 Subsidy Scheme</span><h1 style="font-size:36px;margin:14px 0">Support for your global design ambitions</h1><p>The School of Design provides financial subsidies to support eligible students participating in recognised international and local design competitions and award schemes.</p>
<div class="card"><h2 style="font-size:18px;color:var(--tx)">Key Highlights &amp; Allowances</h2><ul style="padding-left:20px;margin:0"><li><b>Up to HK$1,000</b> entrance fee allowance per recognised competition</li><li><b>Up to HK$1,000</b> shipping and handling support for physical prototypes and submissions</li><li>Streamlined endorsement and fast reimbursement workflow</li><li>Open to all eligible PolyU Design students</li></ul></div>
<div class="note w"><h2 style="font-size:17px;margin-bottom:8px">How to Apply in 3 Steps</h2><ol style="padding-left:20px;margin:0"><li><b>Apply online</b> before submitting your competition entry</li><li><b>Receive endorsement</b> and scheme approval from SD faculty</li><li><b>Upload receipts</b> after announcement to claim reimbursement</li></ol></div></section>
<section><div class="card"><span class="bd">School of Design</span><h2 style="font-size:26px;margin:14px 0 8px">Sign in to the subsidy portal</h2><p>Apply for entrance fee and shipping support for design competitions and awards.</p><button class="btn" style="width:100%" data-go="dash">Sign in with PolyU SSO</button><p style="text-align:center;font-size:13px;color:#6b5a52">Use your PolyU NetID and password.</p><div class="note">Students, endorsers and SD Marketing staff all sign in here. You will see the screens for your role after signing in.</div></div>
<div class="card"><h2 style="font-size:19px">Need help?</h2>Email: <a class="lk">sdmktg@polyu.edu.hk</a><br>Telephone: <a class="lk">2766 4925</a></div></section></div></main>${foot}`,
a1:()=>page('a','New application','Four short steps. It takes about 10 minutes.',stp(1)+`<div class="card"><small>STEP 1 OF 4</small><h2>Your details and eligibility</h2><div class="note">These details come from your PolyU sign-in. Check them and add your telephone number.</div>
<div class="g2" style="grid-template-columns:repeat(auto-fit,minmax(170px,1fr))">${[['Title','Ms'],['Name','Wong Yee Fong'],['Student ID','23012345D'],['Email','yeefong@example.com']].map(x=>`<div class="f"><label>${x[0]}</label><div style="background:#f5ebe4;border-radius:8px;padding:12px;display:flex;justify-content:space-between">${x[1]} <span aria-label="locked">🔒</span></div></div>`).join('')}</div>
${fld('phone','Telephone',S.phone)}
<div class="f"><fieldset><legend>Status (required)</legend>${rad('status','Current student',['Current student','Recent graduate'])}</fieldset></div>
<div class="g2"><div class="f"><label for="yr">Study year (required)</label><select id="yr"><option>Year 1</option><option>Year 2</option><option selected>Year 3</option><option>Year 4</option></select></div><div class="f"><label for="pg">Programme (required)</label><select id="pg"><option selected>Interaction Design</option><option>Product Design</option><option>Visual Communication</option></select></div></div>
<h3 style="color:var(--tx);font-size:17px;margin-bottom:8px">Eligibility</h3><div class="note w" style="background:#f5ebe4;border-color:#f5ebe4"><div data-f="e1"><label class="o"><input type="checkbox" id="e1" checked> I am a current student, or a recent graduate, of an eligible programme.</label><div class="err" role="alert">Please confirm this.</div></div><br><div data-f="e2"><label class="o"><input type="checkbox" id="e2" checked> I am not an in-bound exchange student.</label><div class="err" role="alert">Please confirm this.</div></div></div>
<div class="row"><button class="btn2" data-go="dash">Cancel</button><button class="btn" id="n1">Next: Competition and project</button></div></div>${before}${contact}`),
dash:()=>page('d','Student dashboard','Track your applications and start a new one.',`<div style="text-align:right;margin-bottom:12px"><button class="btn" data-go="a1">Start new application</button></div>
<div class="g3"><div class="stat" style="border-top-color:#7ad0c4"><b style="font-size:16px">Entry quota</b><b>4 of 10 left</b><small>Interaction Design specialism, this year</small><div class="bar"><i></i></div></div><div class="stat" style="border-top-color:var(--o)"><b style="font-size:16px">Open applications</b><b>1</b><small>Waiting for endorsement</small></div><div class="stat"><b style="font-size:16px">Shipping allowance</b><b>HK$1,000</b><small>Maximum per application</small></div></div>
<h2 class="s">iF Student Design Award <span class="bd">Submitted</span></h2><div class="track"><div class="d">Submitted</div><div class="c">Endorser review</div><div>SD Marketing check</div><div class="lk">🔒 Receipts and bank details</div><div class="lk">🔒 Reimbursed</div></div>
<div class="note">Receipts and bank details open after your application is approved. Tell SD Marketing the competition result within one month of the announcement.</div>
<h2 class="s">My applications</h2><div class="card" style="padding:0;overflow:auto"><table><tr><th>Competition</th><th>Project</th><th>Claim</th><th>Status</th><th>Last updated</th><th>Action</th></tr><tr><td>iF Student Design Award</td><td>Wayfinding for first-time hospital visitors</td><td>Entrance fee USD 85, shipping HK$600</td><td><span class="bd">Submitted</span></td><td>30 Oct 2026</td><td><button class="btn2" style="padding:6px 16px" data-go="c1">View</button></td></tr><tr><td>Red Dot</td><td>Quiet kettle</td><td>Entrance fee EUR 120</td><td><span class="bd g">Reimbursed</span></td><td>12 Aug 2026</td><td><button class="btn2" style="padding:6px 16px" data-go="c4">View</button></td></tr></table></div>
<div class="g2"><div class="lock">🔒 <b>Reimbursement</b> <span class="bd" style="float:right">Locked</span><br><small>Opens when an application is approved.</small></div><div class="lock">🔒 <b>Competition result</b> <span class="bd" style="float:right">Locked</span><br><small>Opens after the result is announced.</small></div></div>`),
a2:()=>page('a','New application','Four short steps. It takes about 10 minutes.',stp(2)+`<div class="card"><h2>Competition and project</h2><small>Step 2 of 4</small><br><br>
${fld('comp','Competition or award title',S.comp)}${fld('url','Competition web address',S.url,'text','Check the reference competition list if you are not sure')}
<div class="g2"><div class="f"><label for="cat">Category (optional)</label><input type="text" id="cat" placeholder="Student category"></div><div class="f"><fieldset><legend>Recognition level (required)</legend>${rad('lvl',S.lvl,['Local','National','International'])}</fieldset></div></div>
${fld('date','Result announcement date',S.date,'text','Use the date the organiser says results will be announced')}${fld('proj','Project title',S.proj)}
<div class="f"><fieldset><legend>Is it a group project? (required)</legend>${rad('grp',S.grp,['No','Yes'])}</fieldset></div>
<div id="gm">${fld('mem','Other group members from SD',S.mem)}<div class="note">Only one student who paid the fees fills in the form for the group.</div></div>
<div class="f"><fieldset><legend>Is it coursework? (required)</legend>${rad('cw',S.cw,['No','Yes'])}</fieldset></div>
<div id="cwb" class="g2">${fld('subj','Subject',S.subj)}${fld('tutor="tutor"'.slice(0,5),"Tutor's name",S.tutor)}</div>
<div class="f" data-f="conf"><label class="o"><input type="checkbox" id="conf" checked style="accent-color:var(--r)"> The competition registration states that the project or applicant is from the PolyU School of Design.</label><div class="err" role="alert">Please confirm.</div></div>
<div class="row"><button class="btn2" data-go="a1">Back</button><button class="btn" id="n2">Next: What you are claiming</button></div></div>${before}${contact}`),
a3:()=>page('a','New application','Four short steps. It takes about 10 minutes.',stp(3)+`<div class="card"><small>STEP 3 OF 4</small><h2>What you are claiming</h2><div class="note"><b>Reimbursement policy:</b> You are paid back after your application is approved. Printing, production, publishing, credit card charges and bank fees are not covered.</div>
<label class="o"><input type="checkbox" id="ef" checked style="accent-color:var(--r)"> <b>Entrance fee subsidy</b></label>
<div id="efb" class="g2" style="margin:12px 0 20px"><div class="f"><label for="cur">Currency</label><input type="text" id="cur" value="${S.cur}"></div><div class="f" data-f="fee"><label for="fee">Amount</label><input type="number" id="fee" value="${S.fee}"><div class="err" role="alert">Enter the amount.</div></div></div><hr style="border:0;border-top:1px solid var(--ln)">
<label class="o" style="margin-top:16px"><input type="checkbox" id="sh" checked style="accent-color:var(--r)"> <b>Shipping allowance</b></label>
<div id="shb" class="f" data-f="ship" style="margin-top:12px"><label for="ship">Estimated shipping amount, HK$</label><input type="number" id="ship" value="${S.ship}"><small>Maximum HK$1,000 per application</small><div class="err" role="alert" id="se">Shipping must be HK$1,000 or less. Please lower the amount.</div></div>
<div class="note w" style="background:#fdf0e3"><h3 style="margin-bottom:8px">Declarations</h3><div data-f="d1"><label class="o"><input type="checkbox" id="d1" checked> <b>I declare that this entry is not supported by any other financial scheme.</b></label><div class="err">Please tick this declaration.</div></div><br><div data-f="d2"><label class="o"><input type="checkbox" id="d2" checked> <b>I confirm that this application follows the terms of the Scheme.</b></label><div class="err">Please tick this declaration.</div></div></div>
<div class="row"><button class="btn2" data-go="a2">Back</button><button class="btn" id="n3">Next: Review and send</button></div></div>${before}${contact}`),
a4:()=>page('a','New application','Check your answers. Your endorser must agree before SD Marketing looks at your application.',stp(4)+`
${[['1. Your details',null,[['Name','Wong Yee Fong'],['Student ID','23012345D'],['Email','yeefong@example.com'],['Telephone',S.phone],['Programme','Interaction Design, Year 3']]],['2. Competition','a2',[['Title',S.comp],['Web address',S.url],['Level',S.lvl],['Result announced',S.date]]],['3. Project','a2',[['Title',S.proj],['Group project',S.grp=='Yes'?'Yes, '+S.mem:'No'],['Coursework',S.cw=='Yes'?`Yes, ${S.subj}, ${S.tutor}`:'No']]],['4. Your claim','a3',[['Entrance fee',S.cur+' '+S.fee],['Shipping','HK$'+S.ship],['Declarations','Confirmed']]]].map(([t,g,r])=>`<section class="card"><h2>${t}${g?`<button class="edit" data-go="${g}">Edit</button>`:''}</h2><div class="rv">${r.map(x=>`<span>${x[0]}</span><b>${x[1]}</b>`).join('')}</div></section>`).join('')}
<div class="card" style="background:#fdeed7"><div class="f" data-f="endorser" style="margin:0"><label for="endorser">Who will endorse your application? <small style="display:inline;color:var(--r)">(required)</small></label><input type="text" id="endorser" value="${S.endorser}"><div class="err" role="alert">Please name your endorser.</div></div></div>
<div class="row"><button class="btn2" data-go="a3">Back</button><button class="btn" id="n4">Send for endorsement</button></div>${before}${contact}`),
ok:()=>page('a','New application','Academic Year 2026/2027',`<div class="card"><span class="bd">✓ Submitted</span><h1 style="margin:14px 0 8px">Application sent</h1><p>Your endorser has been told. We will email you at yeefong@example.com when they reply.</p><div class="note" style="background:#fff6ee;border:1px dashed var(--ln)"><b>Application reference: SD-2026-0041</b></div><button class="btn" style="width:100%;margin-bottom:10px" data-go="dash">Back to dashboard</button><button class="btn2" style="width:100%" data-go="c1">View application</button></div>
<div class="card"><h2>What happens next</h2><ol class="ol"><li><i>1</i>Your endorser reviews your application.</li><li><i>2</i>SD Marketing checks it and tells you the result.</li><li><i>3</i>After approval, you send receipts and bank details under Claims.</li><li><i>4</i>SD Marketing pays you.</li></ol></div>${contact}`),
claims:()=>{const c=S.claim,m={submitted:['Submitted','',1,'Waiting for your endorser. We will email you when they reply.'],changes:['Changes requested','rd',1,'Your endorser asked for changes: please add your tutor’s name and send again.'],approved:['Approved','g',3,'Approved by SD Marketing. You can now send receipts and bank details.'],reimbursed:['Reimbursed','g',5,'SD Marketing has paid you. Thank you.']}[c];const tr=['Submitted','Endorsed','Approved'].map((x,i)=>`<div class="${i<m[2]-(c=='submitted'||c=='changes'?1:0)?'d':i==(c=='submitted'||c=='changes'?0:9)?'c':''}${c=='submitted'&&i==0||c=='changes'&&i==0?' c':''}">${x}</div>`).join('');
return page('c','Claims','See where each application stands. Send your receipts once it is approved.',`<div class="f"><label for="app">Application</label><select id="app" style="max-width:520px"><option>iF Student Design Award, Wayfinding for first-time hospital visitors</option></select></div>
<h2 style="font-size:28px">iF Student Design Award <span class="bd ${m[1]}">${m[0]}</span></h2><small>Reference SD-2026-0041 • Sent on 30 Oct 2026</small>
<div class="track">${tr}<div class="${c=='approved'||c=='reimbursed'?'':'lk'}">${c=='approved'||c=='reimbursed'?'✓ ':'🔒 '}Receipts and bank details</div><div class="${c=='reimbursed'?'d':'lk'}">${c=='reimbursed'?'✓':'🔒'} Reimbursed</div></div>
<div class="note ${c=='changes'?'w':''}">${m[3]}</div>${c=='changes'?'<button class="btn" data-go="a2" style="margin-bottom:16px">Edit and send again</button>':''}
<div class="card"><h2>Application details</h2><div class="rv"><span>Competition</span><b>${S.comp}</b><span>Web address</span><b><a class="lk">ifworlddesignguide.com</a></b><span>Recognition level</span><b>${S.lvl}</b><span>Project</span><b>${S.proj}</b><span>Entrance fee claim</span><b>${S.cur} ${S.fee}</b><span>Shipping claim</span><b>HK$${S.ship}</b><span>Endorser</span><b>${S.endorser}</b></div></div>
<div class="card"><h2>History</h2><b>30 Oct 2026</b><br>You sent your application.${c!='submitted'?'<br><br><b>2 Nov 2026</b><br>'+(c=='changes'?'Your endorser asked for changes.':'SD Marketing approved your application.'):''}${c=='reimbursed'?'<br><br><b>20 Nov 2026</b><br>You were paid.':''}</div>
<h2 class="s">Reimbursement</h2>${c=='approved'?`<div class="card"><div class="f"><label for="rc">Upload receipts</label><input type="text" id="rc" value="receipt-iF-entry.pdf"></div><div class="f"><label for="bk">Bank account details</label><input type="text" id="bk" placeholder="Bank, account number"></div><button class="btn" data-claim="reimbursed">Send receipts and bank details</button></div>`:c=='reimbursed'?'<div class="card"><b>Paid.</b> Payment sent to your bank account.</div>':'<div class="lock">🔒 <b>Locked</b> <span class="bd" style="float:right">Locked</span><br>Receipts and bank details open after SD Marketing approves your application.</div>'}
<h2 class="s">Competition result</h2><p>Tell SD Marketing the result within one month of the announcement. Result announced on 15 Dec 2026. Report by 15 Jan 2027.</p><div class="lock">🔒 <b>Locked</b><br>Opens on 15 Dec 2026, when the result is announced.</div>
<div class="row"><button class="btn2" data-go="dash">Back to dashboard</button></div>`)},
ref:()=>{const l=COMPS.filter(c=>c[0].toLowerCase().includes(S.q.toLowerCase()));return page('a','Reference competition list','Competitions the School of Design already recognises. Search by name.',`<div class="note">This list is for reference only. Check the organiser’s website for the final and latest information.</div><div class="note">Your competition is not on the list? Other internationally recognised competitions can also be endorsed. Local competitions may be considered based on their scale and reputation.</div><div class="note">iF Design Award: the jury fee is covered by this scheme.</div>
<h2 class="s">All competitions</h2><div class="f"><label for="q">Search competitions</label><input type="text" id="q" placeholder="Search by competition name..." value="${S.q}"><small>Type part of a name, for example “design” or “film”.</small></div><b>${l.length} competitions</b>
${l.length?`<div class="card" style="padding:0;overflow:auto;margin-top:10px"><table><tr><th>Competition</th><th>Website</th></tr>${l.map(c=>`<tr><td><b>${c[0]}</b></td><td><a class="lk">${c[1]}</a></td></tr>`).join('')}</table></div>`:`<div class="card" style="margin-top:10px"><h2>No results</h2>No competition matches “${S.q}”. Try a shorter name, or check the organiser’s website. <br><br><button class="btn2" id="clr">Clear search</button></div>`}
<div class="card"><h2>Ready to apply?</h2>Check your quota and send your application in four short steps.<br><br><button class="btn" data-go="a1">Start new application</button></div>`)},
rules:()=>{const A=[['cover','What the scheme covers','The full entrance fee for each entry and a shipping allowance up to HK$1,000.'],['not','What is not covered','Printing, production, publishing, credit card charges and bank fees.'],['who','Who can apply','You must be a current student, or a recent graduate, of an eligible programme or specialism.<br><br>BA(Hons) Scheme in Design, Year 1.<br>Clusters: Communication Design, Environment Design, Product Experience Design, Service Design.<br>Specialisms: Advertising, Information, Media, Environmental, Interior, Interaction, Product, Service and Social Design.<br>Recent graduates graduated within one year of the application date. In-bound exchange students are not eligible.'],['quota','Quota','Each specialism has a yearly entry quota. Interaction Design: 10 entries this year.'],['end','Endorsement','Your Programme, Cluster or Specialism Leader agrees to your entry. A Subject Leader endorses interdisciplinary work.'],['comp','Which competitions','See the reference competition list. Other recognised competitions can be endorsed.'],['grp','Group projects','Only one student who paid the fees fills in the form for the group.'],['per','Scheme period','Academic Year 2026/27.']];
return page('r','Scheme rules and help','What the scheme covers, who can apply and what happens next.',`<h2 class="s" style="margin-top:0">What happens after you apply</h2><ol class="ol">${['Send your application|Fill in the form and send it for endorsement.','Your endorser signs|Your leader agrees to your entry.','SD Marketing checks|SD Marketing tells you and your endorser the result.','Send receipts and bank details|After approval, upload your payment receipts and bank details.','You are paid back|SD Marketing arranges the payment.'].map((x,i)=>`<li><i>${i+1}</i><div><b>${x.split('|')[0]}</b><br>${x.split('|')[1]}</div></li>`).join('')}</ol>
<h2 class="s">Scheme rules</h2>${A.map(a=>`<div class="acc ${S.open==a[0]?'o':''}"><button data-acc="${a[0]}" aria-expanded="${S.open==a[0]}">${a[1]}<span>${S.open==a[0]?'−':'+'}</span></button><div>${a[2]}</div></div>`).join('')}
<h2 class="s">Check before you send</h2><div class="note w">Your programme is eligible and you are not an exchange student.<br>No other scheme or person is paying for this entry.<br>Your shipping estimate is HK$1,000 or less.<br>You have your endorser’s agreement.</div>
<h2 class="s">Ready?</h2><button class="btn" data-go="a1">Start new application</button> <button class="btn2" data-go="dash" style="margin-top:8px">Back to dashboard</button><br><br>${contact}
<div class="card"><h2>What each status means</h2><span class="bd">Submitted</span> Your endorser has not replied yet.<br><br><span class="bd rd">Changes requested</span> Edit and send again.<br><br><span class="bd tl">Endorsed</span> SD Marketing is checking.<br><br><span class="bd g">Approved</span> You can send receipts.<br><br><span class="bd g">Reimbursed</span> You have been paid.</div>`)}};
function render(){let k=scr;if(CL[k]){S.claim=CL[k];k='claims'}if(k=='ref0'){S.q='zzz';k='ref'}if(k=='rules2'){S.open='who';k='rules'}
$('#vp').innerHTML=V[k]();if(location.hash!=='#'+scr)history.replaceState(null,'','#'+scr);document.title=(NAMES[scr]||'Portal')+' – PolyU Design Subsidy Portal';scrollTo(0,0);wire()}
function go(s){scr=s;if(s=='ref'&&S.q=='zzz')S.q='';render()}
function chk(id){const e=$('[data-f="'+id+'"]');const bad=!$('#'+id).value.trim();e.classList.toggle('bad',bad);return !bad}
function wire(){$$('[data-go]').forEach(e=>e.onclick=()=>go(e.dataset.go));$$('[data-claim]').forEach(e=>e.onclick=()=>{scr='c4';render()});
$$('.nav a,.bn a').forEach(a=>{if(a.dataset.go=='a2')a.onclick=()=>go('a2')});
$$('#vp input[type=text],#vp input[type=number]').forEach(i=>i.oninput=()=>{if(S.hasOwnProperty(i.id)){S[i.id]=i.value}});
$$('#vp input[type=radio]').forEach(r=>r.onchange=()=>{S[r.name]=r.value;tog()});
$$('[data-acc]').forEach(b=>b.onclick=()=>{S.open=S.open==b.dataset.acc?'':b.dataset.acc;render()});
const q=$('#q');if(q){q.oninput=()=>{S.q=q.value;scr='ref';const p=scrollY;render();$('#q').focus();$('#q').setSelectionRange(S.q.length,S.q.length);scrollTo(0,p)}}
$('#clr')&&($('#clr').onclick=()=>{S.q='';scr='ref';render()});
function tog(){if($('#gm'))$('#gm').style.display=S.grp=='Yes'?'':'none';if($('#cwb'))$('#cwb').style.display=S.cw=='Yes'?'':'none'}tog();
if($('#n1'))$('#n1').onclick=()=>{let ok=chk('phone');['e1','e2'].forEach(d=>{const b=!$('#'+d).checked;$('[data-f='+d+']').classList.toggle('bad',b);if(b)ok=false});if(ok)go('a2')};
if($('#n2'))$('#n2').onclick=()=>{let ok=['comp','url','date','proj'].map(chk).every(x=>x);if(S.grp=='Yes')ok=chk('mem')&&ok;if(S.cw=='Yes')ok=chk('subj')&&chk('tutor')&&ok;if(!$('#conf').checked){$('[data-f=conf]').classList.add('bad');ok=false}if(ok)go('a3')};
if($('#ef'))$('#ef').onchange=()=>$('#efb').style.display=$('#ef').checked?'':'none';
if($('#sh'))$('#sh').onchange=()=>$('#shb').style.display=$('#sh').checked?'':'none';
if($('#n3'))$('#n3').onclick=()=>{let ok=true;S.cur=$('#cur').value;if($('#ef').checked)ok=chk('fee')&&ok;if($('#sh').checked){const v=+$('#ship').value;const bad=!(v>=0&&$('#ship').value!=='')||v>1000;$('[data-f=ship]').classList.toggle('bad',bad);if(bad)ok=false}else S.ship='0';
['d1','d2'].forEach(d=>{const b=!$('#'+d).checked;$('[data-f='+d+']').classList.toggle('bad',b);if(b)ok=false});if(ok)go('a4')};
if($('#n4'))$('#n4').onclick=()=>{if(chk('endorser'))go('ok')}}
addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(NAMES[h]&&h!==scr){scr=h;render()}});
const h0=location.hash.slice(1);if(NAMES[h0])scr=h0;render();
</script></body></html>
